<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soru İnceleme · Matematik Yolu</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5B4BFF">
<link rel="icon" href="img/simge2_192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>:root{
  --bg:#F5F4FF; --surface:#FFFFFF; --surface2:#F0EFFA; --ink:#1E1B4B; --muted:#6B6893; --line:#E3E1F3;
  --brand:#5B4BFF; --brand-d:#4334D9; --brand-t:#E8E5FF;
  --accent:#FF9F1C; --accent-d:#D97F00;
  --ok:#1FBF62; --ok-d:#139A4B; --ok-bg:#E0F8EA; --bad:#FF4D5E; --bad-d:#D3303F; --bad-bg:#FFE5E8;
  --gold:#FFC531; --fire:#FF7A1A; --gem:#18B7F5;
  --teal:#14B8A6; --teal-d:#0E8C7F; --blue:#3B82F6; --blue-d:#2563C9; --orange:#F97316; --orange-d:#C95A0F;
  --pink:#EC4899; --pink-d:#BE2F77; --purple:#8B5CF6; --purple-d:#6B3DD6; --green:#22C55E; --green-d:#169947; --yellow:#EAB308; --yellow-d:#B38806;
  --c0:#5B4BFF; --c1:#FF9F1C; --c2:#14B8A6; --c3:#EC4899; --c4:#22C55E; --c5:#3B82F6;
  --radius:18px; --shadow:0 2px 0 rgba(30,27,75,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13112B; --surface:#1E1B3E; --surface2:#29264F; --ink:#F1F0FF; --muted:#A6A3CC; --line:#36335F; --brand-t:#2E2870;
  --ok-bg:#123A27; --bad-bg:#45161D; color-scheme: dark; } }
:root[data-theme="dark"]{ --bg:#13112B; --surface:#1E1B3E; --surface2:#29264F; --ink:#F1F0FF; --muted:#A6A3CC; --line:#36335F; --brand-t:#2E2870; --ok-bg:#123A27; --bad-bg:#45161D; color-scheme: dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
html,body{margin:0;height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.45;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;padding:0 16px 110px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.01em}
.muted{color:var(--muted)} .sm{font-size:14px} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1}

/* ---------- 3B "tıklanır" butonlar ---------- */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:17px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
  background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d);transition:transform .08s, box-shadow .08s, filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--brand-d)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default;transform:none}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)} .btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.ghost{background:var(--surface);color:var(--brand);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.accent{background:var(--accent);box-shadow:0 4px 0 var(--accent-d)}
.btn.small{padding:10px 14px;font-size:14px;border-radius:12px;width:auto;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand-t);border-color:var(--brand);color:var(--brand)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:var(--brand-t);color:var(--brand)}
.tag.warm{background:#FFF0DB;color:var(--accent-d)} .tag.ok{background:var(--ok-bg);color:var(--ok-d)}

/* ---------- Üst durum çubuğu ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;gap:8px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px}
.stat .ic{font-size:20px}
.stat.fire{color:var(--fire)} .stat.gem{color:var(--gem)}
.ring{width:38px;height:38px}

/* ---------- Alt menü ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:6px 8px;border-radius:12px;cursor:pointer;min-width:58px}
.nav button .ic{font-size:24px;line-height:1}
.nav button.on{color:var(--brand);background:var(--brand-t)}

/* ---------- Tema seçici + başlık ---------- */
.themes{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.banner{border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.banner h2{font-size:20px} .banner .sub{opacity:.92;font-size:14px;font-weight:700}
.banner .bk{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:10px;font-size:13px;font-weight:800}
.banner .big{position:absolute;right:-6px;bottom:-14px;font-size:84px;opacity:.25}
.bg-teal{background:var(--teal)} .bg-blue{background:var(--blue)} .bg-orange{background:var(--orange)} .bg-pink{background:var(--pink)} .bg-purple{background:var(--purple)} .bg-green{background:var(--green)} .bg-yellow{background:var(--yellow)}

/* ---------- Öğrenme yolu ---------- */
.path{position:relative;padding:62px 0 30px;display:flex;flex-direction:column;align-items:center;gap:40px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:72px;border-radius:50%;border:0;cursor:pointer;font-size:30px;display:grid;place-items:center;position:relative;transition:transform .1s}
.node:active{transform:translateY(5px)}
.node.locked{background:var(--line);box-shadow:0 7px 0 #C9C6E0;color:#A4A1C4;cursor:pointer}
.node .crowns{position:absolute;bottom:-8px;right:-6px;background:var(--gold);color:#5A3B00;font-size:12px;font-weight:900;border-radius:10px;padding:1px 7px;border:2px solid var(--surface)}
.node-label{margin-top:12px;font-weight:800;font-size:13px;text-align:center;max-width:140px;color:var(--muted)}
.node.cur{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.bubble{position:absolute;top:-44px;background:var(--surface);border:2px solid var(--line);color:var(--brand);font-weight:900;font-size:13px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:float 1.8s ease-in-out infinite}
.bubble:after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--line)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.path .mascot-side{position:absolute;width:92px}

/* ---------- Maskot: Pi ---------- */
.mascot{display:inline-block;width:110px}
.mascot svg{width:100%;height:auto;overflow:visible}
.mascot .m-body{animation:idle 2.6s ease-in-out infinite;transform-origin:60px 110px}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.02)}}
.mascot .mouth{display:none} .mascot .m-smile{display:block}
.mascot.happy .m-smile{display:none} .mascot.happy .m-grin{display:block}
.mascot.happy .m-body{animation:jump .6s ease-out 2}
.mascot.sad .m-smile{display:none} .mascot.sad .m-oh{display:block}
.mascot.sad .m-body{animation:wobble .7s ease-in-out}
.mascot.think .m-smile{display:none} .mascot.think .m-hmm{display:block}
.mascot .eye{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) scaleY(.92)}100%{transform:translateY(0)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.speech{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;position:relative}

/* ---------- Ders ekranı ---------- */
.lesson{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1}
.prog{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--ok);border-radius:10px;transition:width .4s cubic-bezier(.3,1.4,.6,1);position:relative}
.prog>i:after{content:'';position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.combo{font-weight:900;color:var(--fire);font-size:15px;animation:pop .3s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.lbody{flex:1;padding:4px 16px 16px;overflow-y:auto}
.qprompt{font-size:21px;font-weight:800;margin:6px 0 12px;line-height:1.35}
.qprompt .say{background:var(--brand-t);border:0;border-radius:10px;width:34px;height:34px;font-size:17px;cursor:pointer;vertical-align:middle;margin-left:4px}
.visbox{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 14px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px}
.vis{max-width:100%;height:auto;max-height:210px}
.vis .ln{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.vis .ln.thin{stroke-width:1.6} .vis .ln.thick{stroke-width:5} .vis .ln.dash{stroke-dasharray:5 5;stroke:var(--brand)} .vis .ln.grid{stroke:var(--line);stroke-width:1.2}
.vis .f0{fill:var(--surface);stroke:var(--ink);stroke-width:2} .vis .f1{fill:var(--brand);stroke:var(--ink);stroke-width:2} .vis .f2{fill:var(--brand-t)}
.vis polygon.f2,.vis circle.f2,.vis rect.f2{stroke:var(--ink);stroke-width:2.5}
.vis .dot{fill:var(--ink)} .vis .arc{stroke:var(--accent);stroke-width:3}
.vis .tx{fill:var(--ink);font:800 16px 'Nunito',sans-serif} .vis .tx.sm{font-size:12px} .vis .tx.w{fill:#fff}
.vis .c0{fill:var(--c0)} .vis .c1{fill:var(--c1)} .vis .c2{fill:var(--c2)} .vis .c3{fill:var(--c3)} .vis .c4{fill:var(--c4)} .vis .c5{fill:var(--c5)}
.vis .c1.sep,.vis .c0b.sep,.vis .sep{stroke:var(--surface);stroke-width:2}
.vis .c0b{fill:var(--surface2)}
.vis .sb{fill:var(--blue);stroke:var(--surface);stroke-width:2}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:900;line-height:1.05;margin:0 3px}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.mx{display:inline-flex;align-items:center;font-weight:900}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;font-size:18px;font-weight:800;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s;display:flex;align-items:center;gap:12px;min-height:58px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--brand);background:var(--brand-t);box-shadow:0 4px 0 var(--brand)}
.opt.sel .k{border-color:var(--brand);color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.opts.tf{flex-direction:row} .opts.tf .opt{flex:1;justify-content:center;font-size:20px}
.cmpline{display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px;font-weight:900;margin:14px 0 20px;flex-wrap:wrap}
.cmpbox{width:64px;height:64px;border:3px dashed var(--brand);border-radius:16px;display:grid;place-items:center;color:var(--brand);background:var(--brand-t)}
.opts.cmp{flex-direction:row;justify-content:center} .opts.cmp .opt{width:84px;justify-content:center;font-size:30px;flex:none}
.inbox{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 14px}
.inbox .val{min-width:150px;min-height:62px;border:3px solid var(--brand);border-radius:16px;background:var(--surface);font-size:30px;font-weight:900;display:grid;place-items:center;padding:4px 14px;letter-spacing:.02em}
.inbox .val.empty{color:var(--line)}
.inbox .unit{font-weight:900;font-size:20px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:2px solid var(--line);background:var(--surface);border-radius:14px;font-size:24px;font-weight:900;padding:11px 0;box-shadow:0 3px 0 var(--line);cursor:pointer}
.pad button:active{transform:translateY(3px);box-shadow:none}
.lfoot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--line);display:flex;gap:10px;background:var(--bg)}
.lfoot .hintb{flex:none;width:60px;padding:0;font-size:22px}
.rescue-note{display:flex;gap:10px;align-items:center;background:#FFF4E2;border:2px solid #FFD9A0;color:#8A5300;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px;margin-bottom:10px}
.hintbox{background:#FFF9E6;border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;font-weight:700;margin:-4px 0 12px;color:#6B4E00}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .rescue-note{background:#3A2A10;border-color:#6B4A12;color:#FFD08A} :root:not([data-theme="light"]) .hintbox{background:#3A3010;color:#FFE08A} }
:root[data-theme="dark"] .rescue-note{background:#3A2A10;border-color:#6B4A12;color:#FFD08A} :root[data-theme="dark"] .hintbox{background:#3A3010;color:#FFE08A}

/* ---------- Geri bildirim sayfası ---------- */
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;animation:up .28s cubic-bezier(.2,1.2,.4,1);max-height:78vh;overflow-y:auto}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet.okc{background:var(--ok-bg)} .sheet.badc{background:var(--bad-bg)} .sheet.neutral{background:var(--surface);border-top:2px solid var(--line)}
.sheet h3{font-size:22px;display:flex;align-items:center;gap:8px}
.sheet.okc h3{color:var(--ok-d)} .sheet.badc h3{color:var(--bad-d)}
.sheet .ans{font-weight:800;margin:6px 0}
.mis{background:var(--surface);border-radius:14px;padding:12px;margin:10px 0;border:2px solid var(--line)}
.mis b{color:var(--bad-d)}
.steps{margin:6px 0 0;padding-left:22px} .steps li{margin:3px 0;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(15,12,40,.45);z-index:25;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,1.2,.4,1)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- Konu anlatım kartı ---------- */
.lcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin:4px 0 12px}
.lcard .ftabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.lcard .ftabs::-webkit-scrollbar{display:none}
.lcard p{font-size:18px;font-weight:700;margin:6px 0}
.lcard ol{padding-left:22px;font-size:17px;font-weight:700} .lcard ol li{margin:6px 0}
.lcard .rule{font-size:19px;font-weight:900;background:var(--brand-t);border-radius:14px;padding:14px;color:var(--brand)}
.blk{display:flex;gap:6px;justify-content:center;font-weight:900;font-size:22px;flex-wrap:wrap}
.blk span{background:var(--brand-t);border-radius:10px;padding:6px 10px;min-width:44px;text-align:center}
.blk.lbl span{background:none;font-size:12px;color:var(--muted);padding:0 10px}
.blk u{text-decoration-color:var(--accent);text-decoration-thickness:3px}
.steps4{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.steps4 span{background:var(--brand-t);color:var(--brand);font-weight:900;border-radius:12px;padding:8px 10px;font-size:15px}
.steps4.col{flex-direction:column;align-items:center}

/* ---------- Sonuç ekranı ---------- */
.end{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 16px;gap:14px;min-height:100vh;min-height:100dvh}
.end h1{font-size:30px;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border-radius:16px;border:2px solid;overflow:hidden;font-weight:900}
.tile .h{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#fff;padding:4px}
.tile .v{font-size:22px;padding:10px 4px;background:var(--surface)}
.tile.gold{border-color:var(--gold)} .tile.gold .h{background:var(--gold);color:#5A3B00}
.tile.okt{border-color:var(--ok)} .tile.okt .h{background:var(--ok)}
.tile.bl{border-color:var(--blue)} .tile.bl .h{background:var(--blue)}
.chest{font-size:64px;animation:chest 1s ease-out}
@keyframes chest{0%{transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- Profil, lig, pratik ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.prac{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%}
.prac .ic{font-size:34px;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.prac h3{font-size:17px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.lrow.me{background:var(--brand-t);border:2px solid var(--brand)}
.lrow .rk{width:26px;font-weight:900;text-align:center}
.lrow .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
.zone{font-size:12px;font-weight:900;letter-spacing:.06em;text-align:center;padding:6px;border-radius:10px;margin:4px 0}
.zone.up{color:var(--ok-d);background:var(--ok-bg)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--brand);border-radius:8px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.badge .i{font-size:34px} .badge .n{font-size:12px;font-weight:900;margin-top:4px}
.badge.off{opacity:.35;filter:grayscale(1)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv .card{padding:12px} .kv b{display:block;font-size:22px}
.misrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:700;font-size:15px}
.misrow:last-child{border:0}
pre.report{white-space:pre-wrap;font-family:inherit;font-size:15px;font-weight:600;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;margin:0}
.share{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.share a,.share button{text-decoration:none;text-align:center}
.btn.wa{background:#25D366;box-shadow:0 4px 0 #1B9E4B} .btn.tg{background:#2AABEE;box-shadow:0 4px 0 #1C82B8}

/* ---------- Form / karşılama ---------- */
.onb{padding:24px 16px 40px;display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh}
.field label{display:block;font-weight:900;font-size:14px;margin:0 0 6px}
.field input{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 17px 'Nunito',sans-serif}
.field input:focus{outline:none;border-color:var(--brand)}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer}
.choice.on{border-color:var(--brand);background:var(--brand-t)}
.choice .ic{font-size:32px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--brand)}
.dots{display:flex;gap:6px;justify-content:center} .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--brand);width:22px;border-radius:6px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;z-index:80;animation:pop .3s;max-width:90%;text-align:center}
.timer{font-weight:900;font-size:18px;color:var(--bad);min-width:48px;text-align:right}
.flash-ok{animation:flashok .5s} @keyframes flashok{0%{background:var(--ok-bg)}100%{background:transparent}}
.sect{margin:18px 0 8px;font-size:18px}
@media (min-width:481px){ .nav{border-left:2px solid var(--line);border-right:2px solid var(--line)} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ---------- Kutlama efektleri ---------- */
.fx-layer{position:fixed;inset:0;z-index:70;pointer-events:auto;overflow:hidden}
.fx-canvas{position:absolute;inset:0;pointer-events:none}
.fx-banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center;width:92%}
.fx-word{font-weight:900;font-size:46px;line-height:1;letter-spacing:-.01em;color:#fff;-webkit-text-stroke:2px var(--brand-d);paint-order:stroke fill;text-shadow:0 5px 0 var(--brand-d),0 10px 24px rgba(30,27,75,.35);animation:fxPop .9s cubic-bezier(.2,1.6,.4,1) both}
.fx-sub{font-weight:900;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;animation:fxSub .9s .15s both}
.fx-banner.fire .fx-word{-webkit-text-stroke-color:#B4410B;text-shadow:0 5px 0 #B4410B,0 0 30px rgba(255,122,26,.8);color:#FFE7B3}
.fx-banner.gold .fx-word{font-size:40px;color:#FFE27A;-webkit-text-stroke-color:#8A5A00;text-shadow:0 5px 0 #8A5A00,0 0 34px rgba(255,197,49,.9);animation:fxPop .9s cubic-bezier(.2,1.6,.4,1) both,fxGlow 1s ease-in-out .5s infinite alternate}
.fx-banner.rainbow .fx-word{font-size:54px;background:linear-gradient(90deg,#FF4D5E,#FF9F1C,#FFC531,#1FBF62,#22CDBE,#5B4BFF,#EC4899);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(0 5px 0 rgba(30,27,75,.5));background-size:200% 100%;animation:fxPop .9s cubic-bezier(.2,1.6,.4,1) both,fxRainbow 1.2s linear infinite}
.fx-banner.grow .fx-word{font-size:34px;color:#E9FFF1;-webkit-text-stroke-color:var(--ok-d);text-shadow:0 5px 0 var(--ok-d)}
.fx-banner.calm .fx-word{font-size:64px;color:var(--ok);-webkit-text-stroke:0;text-shadow:none;animation:fade .3s}
.fx-xp{position:absolute;transform:translate(-50%,0);font-weight:900;font-size:26px;color:var(--gold);-webkit-text-stroke:1.5px #8A5A00;paint-order:stroke fill;animation:fxXP 1.1s ease-out forwards;pointer-events:none}
.fx-pi{position:absolute;left:50%;bottom:-160px;transform:translateX(-50%);pointer-events:none}
.fx-pi.rocket{animation:fxRocket 1.15s cubic-bezier(.5,0,.6,1) forwards}
.fx-pi.jump{animation:fxJump 1.3s cubic-bezier(.2,1.3,.4,1) forwards}
.fx-flame{position:absolute;left:50%;bottom:-18px;width:34px;height:46px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 20%,#FFF6C2 0%,#FFC531 35%,#FF7A1A 65%,transparent 72%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fxFlame .12s infinite alternate}
.fx-sprout{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:78px;width:90px;height:90px;pointer-events:none}
.fx-sprout span{position:absolute;inset:0;display:grid;place-items:center;opacity:0}
.fx-sprout span:nth-child(1){animation:fxStage .45s 0s both}
.fx-sprout span:nth-child(2){animation:fxStage .45s .35s both}
.fx-sprout span:nth-child(3){animation:fxStageEnd .8s .7s both}
#app.fx-shake{animation:shake .45s}
@keyframes fxPop{0%{transform:scale(.2) rotate(-8deg);opacity:0}55%{transform:scale(1.18) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fxSub{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
@keyframes fxGlow{to{filter:brightness(1.25)}}
@keyframes fxRainbow{to{background-position:200% 0}}
@keyframes fxXP{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}
@keyframes fxRocket{0%{bottom:-160px;transform:translateX(-50%) rotate(-6deg)}35%{bottom:28%;transform:translateX(-50%) rotate(4deg)}55%{bottom:30%}100%{bottom:120%;transform:translateX(-50%) rotate(-3deg)}}
@keyframes fxJump{0%{bottom:-160px}40%{bottom:6%}60%{bottom:9%}80%{bottom:6%}100%{bottom:-170px}}
@keyframes fxFlame{to{transform:translateX(-50%) scaleY(1.25)}}
@keyframes fxStage{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
@keyframes fxStageEnd{0%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}

/* ---------- v3: tersine mühendislik eklemeleri ---------- */
.kombo{margin:-6px 16px 0;align-self:flex-start;font-weight:900;font-size:12px;letter-spacing:.08em;color:var(--brand);animation:pop .3s}
.kombo.hot{color:var(--fire);text-shadow:0 0 12px rgba(255,122,26,.45)}
.tag.new{background:#F3E8FF;color:#7C3AED}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.new{background:#3B2470;color:#D8B4FE} }
:root[data-theme="dark"] .tag.new{background:#3B2470;color:#D8B4FE}
/* örüntü tablosu */
.pgrid{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:16px;overflow:hidden;margin:4px 0 16px;background:var(--surface)}
.pcell{padding:12px;min-height:58px;display:grid;place-items:center;font-weight:900;font-size:20px;border-bottom:2px solid var(--line)}
.pcell:nth-child(odd){border-right:2px solid var(--line)}
.pcell:nth-last-child(-n+2){border-bottom:0}
.pcell.miss{background:var(--brand-t);color:var(--brand);outline:3px dashed var(--brand);outline-offset:-8px;border-radius:4px}
.pcell .vis{max-height:64px}
.opts.cards{flex-direction:row;flex-wrap:wrap}
.opts.cards .opt{flex:1 1 calc(33% - 8px);justify-content:center;min-height:76px;font-size:22px}
.opts.cards .opt .k{display:none}
/* eşleştirme tahtası */
.mboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcell{min-height:84px;border:2px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:0 4px 0 var(--line);font-weight:900;font-size:19px;display:grid;place-items:center;padding:8px;cursor:pointer;position:relative;overflow:hidden;transition:transform .08s,opacity .3s}
.mcell .vis{max-height:72px}
.mcell:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mcell.sel{border-color:var(--brand);background:var(--brand-t);box-shadow:0 4px 0 var(--brand)}
.mcell.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.mcell.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok);animation:stamp .45s cubic-bezier(.2,1.5,.4,1)}
.mcell.ok::after,.opt.right::after{content:'';position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:shine .6s ease-out .05s forwards}
.mcell.gone{opacity:.28;box-shadow:none;cursor:default}
.opt{position:relative;overflow:hidden}
@keyframes stamp{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shine{to{left:130%}}
.mright{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;margin-top:8px}
.mright .vis{max-height:52px}
/* kısmi doğru (sarı) */
.sheet.partc{background:#FFF4D6}
.sheet.partc h3{color:#A86A00}
.btn.warn{background:#F5B400;box-shadow:0 4px 0 #B88500;color:#3B2A00}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sheet.partc{background:#3D3110} :root:not([data-theme="light"]) .sheet.partc h3{color:#FFD36B} }
:root[data-theme="dark"] .sheet.partc{background:#3D3110} :root[data-theme="dark"] .sheet.partc h3{color:#FFD36B}
/* ara ve yükleme ekranı */
.mid{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 16px;text-align:center;animation:fade .25s}
.mid h1{font-size:28px;color:var(--brand);text-wrap:balance;animation:fxPop .7s cubic-bezier(.2,1.6,.4,1) both}
/* görevler */
.mbanner{display:flex;align-items:center;gap:12px;background:var(--accent);color:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--accent-d);margin-top:4px}
.mbanner h2{font-size:22px}
.quest{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.quest:last-child{border:0}
.quest .qi{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:var(--surface2);border-radius:12px;flex:none}
.quest .qr{display:flex;flex-direction:column;align-items:center;font-size:24px}
.quest .qr small{font-size:11px;font-weight:900;color:var(--gem)}
.quest.done{opacity:.7}
.qbar{position:relative;height:18px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;background:var(--gold);border-radius:10px;transition:width .5s}
.qbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink)}
.qbar.light{background:rgba(255,255,255,.35)} .qbar.light i{background:#fff} .qbar.light span{color:var(--accent-d)}
/* kitaplar */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 2px 0 var(--line)}
.bk-theme{margin-bottom:22px}
.toc{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-top:0;border-radius:0 0 18px 18px;margin-top:-10px;padding:16px 6px 6px}
.tocrow{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 8px;cursor:pointer;font-size:15px;color:var(--ink)}
.tocrow:last-child{border:0}
.tocrow[disabled]{cursor:default;opacity:.65}
.tocrow .pg{flex:none;width:44px;font-weight:900;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tocrow .chev{font-size:22px;color:var(--muted)}
.tocrow b{display:block}
.tocrow.hazir b,.tocrow.olcme b,.tocrow.izleme b,.tocrow.performans b{color:var(--brand)}
.skcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.skc{font-size:11px;font-weight:800;background:var(--surface2);border-radius:8px;padding:2px 7px;color:var(--muted)}
.skc.on{background:#FFF4D6;color:#8A5A00}
/* lig */
.tiers{display:flex;justify-content:space-between;gap:4px;margin:8px 0}
.tier{flex:1;display:flex;flex-direction:column;align-items:center;font-size:30px;opacity:.35;filter:grayscale(.8)}
.tier small{font-size:10px;font-weight:900;color:var(--muted)}
.tier.past{opacity:.6;filter:none}
.tier.on{opacity:1;filter:none;transform:scale(1.25);animation:float 2s ease-in-out infinite}
.zone.down{color:var(--bad-d);background:var(--bad-bg)}
/* profil */
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats4>div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.stats4 span{font-size:24px;grid-row:span 2}
.stats4 b{font-size:17px;line-height:1.1}
.stats4 small{font-size:12px;color:var(--muted);font-weight:800}

.btn.hintb.nudge{animation:nudge 1s ease-in-out 3;border-color:var(--gold)}
@keyframes nudge{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.08)}40%{transform:rotate(10deg) scale(1.08)}60%{transform:rotate(-6deg)}}

/* Yanlış cevap = öğrenme anı: ceza kırmızısı yerine sıcak, yumuşak ton */
.sheet.learnc{background:#FFF3E0} .sheet.learnc h3{color:#B3560B}
.sheet.learnc .sub{color:var(--muted);font-weight:700;font-size:14px;margin-top:2px}
.sheet.learnc .mis b{color:#B3560B}
.howto{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.howto summary{font-weight:900;cursor:pointer;list-style:none} .howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:' ▾';color:var(--muted)} .howto[open] summary::after{content:' ▴'}
.howto .steps{margin-top:8px}
.modal-bg{position:fixed;inset:0;z-index:35;background:rgba(10,8,30,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sheet.learnc{background:#3A2A16} :root:not([data-theme="light"]) .sheet.learnc h3, :root:not([data-theme="light"]) .sheet.learnc .mis b{color:#FFC27A} :root:not([data-theme="light"]) .lcard .rule{color:#D4CEFF} }
:root[data-theme="dark"] .sheet.learnc{background:#3A2A16} :root[data-theme="dark"] .sheet.learnc h3, :root[data-theme="dark"] .sheet.learnc .mis b{color:#FFC27A} :root[data-theme="dark"] .lcard .rule{color:#D4CEFF}
.vstat{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface2);margin-top:8px}
.vstat .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)} .vstat.ok .dot{background:var(--ok)} .vstat.bad .dot{background:var(--bad)}

/* Pi görsel seti (Higgsfield) */
.mascot.pim img{width:100%;height:auto;display:block;transform-origin:50% 95%;animation:idle 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(20,30,90,.25));user-select:none;-webkit-user-drag:none}
.mascot.pim.happy img{animation:jump .6s ease-out 2, idle 2.6s ease-in-out 1.2s infinite}
.mascot.pim.sad img{animation:wobble .7s ease-in-out, idle 2.6s ease-in-out .7s infinite}
.mascot.pim.think img{animation:idle 3.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.mascot.pim img{animation:none}}

.onb .hero{width:min(78vw,300px);aspect-ratio:1;border-radius:28px;box-shadow:0 12px 40px rgba(40,60,200,.35);display:block;margin:0 auto}

/* Bilim kurgu kutlama sahnesi */
.sahne{position:fixed;inset:0;z-index:90;background:#070a2a;display:flex;align-items:center;justify-content:center;animation:fade .18s;cursor:pointer}
.sahne video{width:100%;height:100%;object-fit:cover;max-width:560px}
.sahne.kapan{opacity:0;transition:opacity .2s}
.sahne-yazi{position:absolute;top:calc(9% + env(safe-area-inset-top));left:0;right:0;text-align:center;font-weight:900;font-size:clamp(30px,9vw,46px);color:#fff;letter-spacing:.02em;text-shadow:0 0 18px #2be4ff,0 0 36px #5b4bff,0 3px 0 #1b1f6b;animation:sahneYazi .5s cubic-bezier(.2,1.6,.4,1)}
.sahne-gec{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-weight:800;font-size:13px}
@keyframes sahneYazi{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* Harita mahallesi: tema komşuları */
.komsu{position:absolute;right:calc(100% + 26px);top:-34px;width:96px;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;z-index:2}
.komsu img{width:96px;height:auto;display:block;transform-origin:50% 92%;filter:drop-shadow(0 6px 8px rgba(20,30,90,.28));user-select:none;-webkit-user-drag:none}
.komsu .kad{margin-top:2px;font-size:11px;font-weight:900;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:1px 8px;white-space:nowrap}
.komsu .kbal{position:absolute;top:calc(100% + 8px);left:-14px;width:160px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:7px 10px;font-size:12.5px;font-weight:800;line-height:1.3;text-align:left;box-shadow:0 4px 0 var(--line);opacity:0;transform:translateY(-6px) scale(.9);transform-origin:30% 0;pointer-events:none;transition:opacity .2s,transform .2s}
.komsu .kbal:after{content:'';position:absolute;left:56px;top:-9px;border:8px solid transparent;border-bottom-color:var(--line);border-top:0}
.komsu .kbal.acik{opacity:1;transform:none}
.komsu:after{content:'💬';position:absolute;top:-2px;right:-4px;font-size:16px;animation:float 1.8s ease-in-out infinite}
.komsu.tik:after{display:none}
.k-sal img{animation:kSal 3.2s ease-in-out infinite}
.k-egil img{animation:kEgil 4s ease-in-out infinite}
.k-zipla img{animation:kZipla 2.4s ease-in-out infinite}
.k-uc img{animation:kUc 2.8s ease-in-out infinite}
.komsu.tik img{animation:jump .6s ease-out}
@keyframes kSal{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes kEgil{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg)}85%{transform:rotate(3deg)}}
@keyframes kZipla{0%,55%,100%{transform:translateY(0) scaleY(1)}62%{transform:translateY(0) scaleY(.9)}75%{transform:translateY(-12px) scaleY(1.04)}88%{transform:translateY(0) scaleY(.95)}}
@keyframes kUc{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@media (prefers-reduced-motion: reduce){.komsu img,.komsu:after{animation:none!important}}

/* Parmakla kesir (type 'kes') */
.kes{display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0 4px}
.kes-svg{width:100%;max-width:340px;height:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kes-svg.pie{max-width:230px}
.kes-svg .kd{fill:var(--surface);stroke:var(--brand);stroke-width:2.5;cursor:pointer;transition:fill .15s}
.kes-svg .kd.on{fill:var(--pink,#FF5FA2)}
.kes-svg .kd:active{opacity:.8}
.kes-not{font-weight:800;color:var(--muted);min-height:28px;display:flex;align-items:center;gap:6px}
.kes-fr{font-size:20px;color:var(--ink)}
.kes-adim{display:flex;align-items:center;gap:14px}
.kes-adim .btn{width:52px;height:52px;min-height:52px;padding:0;font-size:26px;flex:none}
.kes-adim div{display:flex;flex-direction:column;align-items:center;min-width:56px;font-size:26px;font-weight:900;line-height:1}
.kes-adim small{font-size:12px;color:var(--muted)}
.kl-ana{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.kl-cizgi{stroke:var(--muted);stroke-width:2}
.kl-cizgi.tam{stroke:var(--ink);stroke-width:3}
.kl-yazi{font:900 17px Nunito,sans-serif;fill:var(--ink);text-anchor:middle}

<body class="ogretmen">
<div id="panel"></div>
<script>/* ============================================================
   Matematik Yolu — çekirdek yardımcılar + SVG görselleri
   Not: Tüm sayısal cevaplar KODLA hesaplanır (LLM yok) → hatasız.
   ============================================================ */
(function (G) {
  'use strict';
  const U = {};
  U.ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));       // [a,b] tam sayı
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  U.gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
  U.NB = ' ';
  // 15702436 -> "15 702 436" (kitaptaki gibi boşluklu)
  U.fmtN = (n) => { const s = String(Math.round(n)); return s.replace(/\B(?=(\d{3})+(?!\d))/g, U.NB); };
  // ondalık virgül: 0.25 -> "0,25"
  U.fmtD = (x, dp) => { let s = (dp === undefined) ? String(+x.toFixed(6)) : x.toFixed(dp); return s.replace('.', ','); };
  U.fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
  U.mixed = (w, n, d) => `<span class="mx">${w}${U.fr(n, d)}</span>`;
  U.norm = (s) => String(s).trim().toLowerCase().replace(/[\s  ]/g, '').replace(/\./g, '').replace('%', '%');
  // Sayısal giriş karşılaştırma: "0,5" "0.5" " 0,50 " hepsi eşit
  U.numEq = (input, target) => {
    const clean = (v) => String(v).replace(/[\s  ]/g, '').replace('%', '').replace(',', '.');
    const a = parseFloat(clean(input)), b = parseFloat(clean(target));
    if (isNaN(a) || isNaN(b)) return U.norm(input) === U.norm(target);
    return Math.abs(a - b) < 1e-9;
  };

  /* -------- Türkçe sayı okunuşu (milyara kadar) -------- */
  const ONES = ['', 'bir', 'iki', 'üç', 'dört', 'beş', 'altı', 'yedi', 'sekiz', 'dokuz'];
  const TENS = ['', 'on', 'yirmi', 'otuz', 'kırk', 'elli', 'altmış', 'yetmiş', 'seksen', 'doksan'];
  function three(n) {
    const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), o = n % 10, p = [];
    if (h) p.push(h === 1 ? 'yüz' : ONES[h] + ' yüz');
    if (t) p.push(TENS[t]);
    if (o) p.push(ONES[o]);
    return p.join(' ');
  }
  U.words = function (n) {
    if (n === 0) return 'sıfır';
    const names = ['', 'bin', 'milyon', 'milyar'], parts = [];
    let g = 0;
    while (n > 0) {
      const chunk = n % 1000;
      if (chunk) {
        let w = (g === 1 && chunk === 1) ? '' : three(chunk);
        parts.unshift((w + ' ' + names[g]).trim());
      }
      n = Math.floor(n / 1000); g++;
    }
    return parts.join(' ').replace(/\s+/g, ' ');
  };
  /* -------- Türkçe ek uyumu: 12'nin, 40'ın, 3'er, 11.40'ta, Yusuf'un -------- */
  U.ek = function (word, kind) {
    const w = String(word).toLocaleLowerCase('tr-TR').trim(), V = 'aeıioöuü';
    let lv = 'e'; for (let i = w.length - 1; i >= 0; i--) if (V.includes(w[i])) { lv = w[i]; break; }
    const back = 'aıou'.includes(lv), round = 'ouöü'.includes(lv), endV = V.includes(w[w.length - 1]), hard = 'fstkçşhp'.includes(w[w.length - 1]);
    const i4 = back ? (round ? 'u' : 'ı') : (round ? 'ü' : 'i'), a2 = back ? 'a' : 'e';
    switch (kind) {
      case 'in': return (endV ? 'n' : '') + i4 + 'n';          // ilgi: 'nin
      case 'e': return (endV ? 'y' : '') + a2;             // yönelme: 'ye
      case 'de': return (hard ? 't' : 'd') + a2;           // bulunma: 'de
      case 'den': return (hard ? 't' : 'd') + a2 + 'n';    // ayrılma: 'den
      case 'i': return (endV ? 'y' : '') + i4;             // belirtme: 'yi
      case 'er': return (endV ? 'ş' : '') + a2 + 'r';      // üleştirme: 'şer
    }
    return '';
  };
  U.lastWord = (n) => { const ws = U.words(n).split(' '); return ws[ws.length - 1]; };
  U.nk = (n, kind) => `${n}'${U.ek(U.lastWord(n), kind)}`;             // sayı + ek
  U.wk = (word, kind) => `${word}'${U.ek(word, kind)}`;                 // özel ad + ek
  U.tk = (h, m, kind) => `${String(h).padStart(2, '0')}.${String(m).padStart(2, '0')}'${U.ek(U.lastWord(m || h), kind)}`; // saat + ek
  U.toSpeech = (html) => {
    let s = String(html).replace(/<span class="fr"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g, (m, n, d) => { const dn = +d, nn = +n; return (isNaN(dn) || isNaN(nn)) ? ` ${n} bölü ${d} ` : ` ${U.words(dn)}${U.ek(U.lastWord(dn), 'de')} ${U.words(nn)} `; });
    s = s.replace(/<[^>]+>/g, ' ').replace(/(\d)[  ](?=\d{3})/g, '$1').replace(/×/g, ' çarpı ').replace(/÷/g, ' bölü ').replace(/−/g, ' eksi ').replace(/\+/g, ' artı ').replace(/=/g, ' eşittir ')
      .replace(/%(\d+)/g, 'yüzde $1').replace(/²/g, ' kare').replace(/³/g, ' küp').replace(/°/g, ' derece').replace(/\.{3,}/g, ' boşluk ').replace(/⊥/g, ' diktir ').replace(/\/\//g, ' paraleldir ').replace(/[▲]/g, ' üçgen ').replace(/\s+/g, ' ');
    return s.trim();
  };
  // Pi'nin soru okuması için: toSpeech + birimlerin açık okunuşu (cm → santimetre). Sunucu (soru-sesi) aynı metni bekler.
  U.soruSesi = (html) => U.toSpeech(html)
    .replace(/\bcm\b'?/g, 'santimetre').replace(/\bmm\b'?/g, 'milimetre').replace(/\bkm\b'?/g, 'kilometre').replace(/(\d) ?m\b'?/g, '$1 metre')
    .replace(/\bkg\b'?/g, 'kilogram').replace(/\bTL'd[iı]r/g, 'liradır').replace(/\bTL'l[iı]k/g, 'liralık').replace(/\bTL'y[ea]/g, 'liraya').replace(/\bTL's[iı]/g, 'lirası').replace(/\bTL'n[iı]n/g, 'liranın').replace(/\bTL\b'?/g, 'lira').replace(/eşittir \?/g, 'eşittir kaç?').replace(/\d*▢[▢\s\d]*/g, ' kutulu ').replace(/\(([^()]*\d[^()]*)\)/g, ' parantez aç, $1 parantez kapa, ').replace(/\(([^()]*)\)/g, ', $1, ').replace(/→/g, ', ').replace(/[\[\]|]/g, ' ').replace(/\s+/g, ' ').trim();
  U.cap = (s) => s.charAt(0).toLocaleUpperCase('tr-TR') + s.slice(1);

  /* =================== SVG GÖRSELLER =================== */
  const V = {};
  const svg = (w, h, inner, label) => `<svg class="vis" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label || 'şekil'}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  const rad = (d) => d * Math.PI / 180;

  // Kesir şeridi: n parça, k boyalı
  V.bar = (k, n, label) => {
    const W = 300, H = 56, w = (W - 8) / n; let s = '';
    for (let i = 0; i < n; i++) s += `<rect x="${4 + i * w}" y="8" width="${w}" height="40" rx="3" class="${i < k ? 'f1' : 'f0'}"/>`;
    return svg(W, H, s, label || `${n} eş parçadan ${k} tanesi boyalı`);
  };
  // Pasta modeli
  V.pie = (k, n, label) => {
    const R = 52, cx = 60, cy = 60; let s = '';
    if (n === 1) return svg(120, 120, `<circle cx="${cx}" cy="${cy}" r="${R}" class="${k ? 'f1' : 'f0'}"/>`, label);
    for (let i = 0; i < n; i++) {
      const a0 = rad(-90 + 360 * i / n), a1 = rad(-90 + 360 * (i + 1) / n);
      const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
      s += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" class="${i < k ? 'f1' : 'f0'}"/>`;
    }
    return svg(120, 120, s, label || `${n} dilimden ${k} tanesi boyalı daire`);
  };
  // Yüzlük tablo
  V.grid100 = (k) => {
    let s = '';
    for (let i = 0; i < 100; i++) { const r = Math.floor(i / 10), c = i % 10; s += `<rect x="${4 + c * 16}" y="${4 + r * 16}" width="15" height="15" rx="2" class="${i < k ? 'f1' : 'f0'}"/>`; }
    return svg(168, 168, s, `100 kareden ${k} tanesi boyalı`);
  };
  // Açı (derece) — kol uzunlukları ayrı
  V.angle = (deg, opts = {}) => {
    const L1 = opts.l1 || 110, L2 = opts.l2 || 110, rot = opts.rot || 0, W = 260, H = 170;
    const cx = opts.cx || 130, cy = opts.cy || 140;
    const a0 = rad(-rot), a1 = rad(-(rot + deg));
    const x0 = cx + L1 * Math.cos(a0), y0 = cy + L1 * Math.sin(a0), x1 = cx + L2 * Math.cos(a1), y1 = cy + L2 * Math.sin(a1);
    let arc = '';
    if (deg === 90) {
      const r = 18, p1x = cx + r * Math.cos(a0), p1y = cy + r * Math.sin(a0), p2x = cx + r * Math.cos(a1), p2y = cy + r * Math.sin(a1);
      const qx = cx + r * Math.SQRT2 * Math.cos(rad(-(rot + 45))), qy = cy + r * Math.SQRT2 * Math.sin(rad(-(rot + 45)));
      arc = `<path d="M${p1x},${p1y} L${qx},${qy} L${p2x},${p2y}" class="ln thin" fill="none"/>`;
    } else {
      const r = 28, ax0 = cx + r * Math.cos(a0), ay0 = cy + r * Math.sin(a0), ax1 = cx + r * Math.cos(a1), ay1 = cy + r * Math.sin(a1);
      arc = `<path d="M${ax0},${ay0} A${r},${r} 0 ${deg > 180 ? 1 : 0} 0 ${ax1},${ay1}" class="arc" fill="none"/>`;
    }
    const lab = opts.label ? `<text x="${cx + 44 * Math.cos(rad(-(rot + deg / 2)))}" y="${cy + 44 * Math.sin(rad(-(rot + deg / 2))) + 5}" class="tx" text-anchor="middle">${opts.label}</text>` : '';
    return svg(W, H, `<line x1="${cx}" y1="${cy}" x2="${x0}" y2="${y0}" class="ln"/><line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" class="ln"/>${arc}<circle cx="${cx}" cy="${cy}" r="4" class="dot"/>${lab}`, opts.aria || 'açı');
  };
  // Aynı ölçülü, farklı kol uzunluklu iki açı
  V.twoAngles = (deg) => {
    const one = (cx, L) => { const x1 = cx + L * Math.cos(rad(-deg)), y1 = 130 + L * Math.sin(rad(-deg)), r = 22;
      return `<line x1="${cx}" y1="130" x2="${cx + L}" y2="130" class="ln"/><line x1="${cx}" y1="130" x2="${x1}" y2="${y1}" class="ln"/><path d="M${cx + r},130 A${r},${r} 0 0 0 ${cx + r * Math.cos(rad(-deg))},${130 + r * Math.sin(rad(-deg))}" class="arc" fill="none"/><circle cx="${cx}" cy="130" r="4" class="dot"/>`; };
    return svg(300, 150, one(20, 60) + `<text x="50" y="148" class="tx sm" text-anchor="middle">1. açı</text>` + one(130, 150) + `<text x="200" y="148" class="tx sm" text-anchor="middle">2. açı</text>`, 'kol uzunlukları farklı iki açı');
  };
  // Doğru / ışın / doğru parçası
  V.lineKind = (kind, harf) => {
    const [h1, h2] = harf || ['A', 'B'];
    const y = 45; let s = '';
    const arrow = (x, dir) => `<path d="M${x},${y} l${-12 * dir},-7 l0,14 Z" class="dot"/>`;
    if (kind === 'dp') s = `<line x1="50" y1="${y}" x2="230" y2="${y}" class="ln"/><circle cx="50" cy="${y}" r="5" class="dot"/><circle cx="230" cy="${y}" r="5" class="dot"/><text x="50" y="${y + 28}" class="tx" text-anchor="middle">${h1}</text><text x="230" y="${y + 28}" class="tx" text-anchor="middle">${h2}</text>`;
    if (kind === 'isin') s = `<line x1="50" y1="${y}" x2="262" y2="${y}" class="ln"/>${arrow(270, 1)}<circle cx="50" cy="${y}" r="5" class="dot"/><circle cx="170" cy="${y}" r="5" class="dot"/><text x="50" y="${y + 28}" class="tx" text-anchor="middle">${h1}</text><text x="170" y="${y + 28}" class="tx" text-anchor="middle">${h2}</text>`;
    if (kind === 'dogru') s = `<line x1="18" y1="${y}" x2="262" y2="${y}" class="ln"/>${arrow(10, -1)}${arrow(270, 1)}<circle cx="90" cy="${y}" r="5" class="dot"/><circle cx="190" cy="${y}" r="5" class="dot"/><text x="90" y="${y + 28}" class="tx" text-anchor="middle">${h1}</text><text x="190" y="${y + 28}" class="tx" text-anchor="middle">${h2}</text>`;
    if (kind === 'nokta') s = `<circle cx="140" cy="${y}" r="6" class="dot"/><text x="140" y="${y + 30}" class="tx" text-anchor="middle">${h1}</text>`;
    return svg(280, 90, s, 'geometrik çizim');
  };
  // İki doğru: 'dik' | 'paralel' | 'kesisen'
  V.twoLines = (rel, rot, harf, kesAci) => {
    rot = rot || 0; const [h1, h2] = harf || ['d', 'k']; const cx = 140, cy = 85, L = 120;
    const seg = (ang, ox = 0, oy = 0) => { const a = rad(ang); return `<line x1="${cx + ox - L * Math.cos(a)}" y1="${cy + oy - L * Math.sin(a)}" x2="${cx + ox + L * Math.cos(a)}" y2="${cy + oy + L * Math.sin(a)}" class="ln"/>`; };
    let s = '';
    if (rel === 'paralel') { const a = rad(rot + 90); s = seg(rot, 32 * Math.cos(a), 32 * Math.sin(a)) + seg(rot, -32 * Math.cos(a), -32 * Math.sin(a)); }
    if (rel === 'dik') {
      s = seg(rot) + seg(rot + 90);
      const r = 16, a0 = rad(rot), a1 = rad(rot + 90), aq = rad(rot + 45);
      s += `<path d="M${cx + r * Math.cos(a0)},${cy + r * Math.sin(a0)} L${cx + r * Math.SQRT2 * Math.cos(aq)},${cy + r * Math.SQRT2 * Math.sin(aq)} L${cx + r * Math.cos(a1)},${cy + r * Math.sin(a1)}" class="ln thin" fill="none"/>`;
    }
    if (rel === 'kesisen') s = seg(rot) + seg(rot + (kesAci || 55));
    s += `<text x="16" y="20" class="tx">${h1}</text><text x="250" y="20" class="tx">${h2}</text>`;
    return svg(280, 170, s, 'iki doğru');
  };
  // Düzgün çokgen
  V.polygon = (n, diag) => {
    const cx = 90, cy = 88, R = 70, pts = [];
    for (let i = 0; i < n; i++) { const a = rad(-90 + 360 * i / n); pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
    let s = `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" class="f2 ln"/>`;
    if (diag) for (let j = 2; j < n - 1; j++) s += `<line x1="${pts[0][0]}" y1="${pts[0][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" class="ln thin dash"/>`;
    pts.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" class="dot"/>`; });
    return svg(180, 176, s, `${n} kenarlı düzgün çokgen`);
  };
  // Çember (merkez, yarıçap veya çap)
  V.circle = (show, val) => {
    const cx = 90, cy = 85, R = 66;
    let s = `<circle cx="${cx}" cy="${cy}" r="${R}" class="f2 ln"/><circle cx="${cx}" cy="${cy}" r="4" class="dot"/><text x="${cx - 6}" y="${cy + 20}" class="tx">O</text>`;
    if (show === 'r') s += `<line x1="${cx}" y1="${cy}" x2="${cx + R}" y2="${cy}" class="ln"/><text x="${cx + R / 2}" y="${cy - 8}" class="tx" text-anchor="middle">${val}</text>`;
    if (show === 'd') s += `<line x1="${cx - R}" y1="${cy}" x2="${cx + R}" y2="${cy}" class="ln"/><text x="${cx + R / 2}" y="${cy - 8}" class="tx" text-anchor="middle">${val}</text>`;
    return svg(180, 172, s, 'çember');
  };

  // Doğru + yanlışlardan şık seti; aynı metinleri ayıklar
  function mc(correct, wrongs, fillers) {
    const seen = new Set([String(correct)]), opts = [{ t: String(correct), ok: true }];
    for (const [t, mis, ac] of wrongs) { const k = String(t); if (!seen.has(k) && opts.length < 4) { seen.add(k); opts.push(ac ? { t: k, ok: false, mis, ac } : { t: k, ok: false, mis }); } }
    // Dolgu şıkları yalnız bir yanılgıya bağlıysa eklenir (§1-3: rastgele çeldirici yok). 'genel' dolgu atlanır; soru 3 şıkla kalabilir.
    if (fillers) for (const [t, mis] of fillers) { const k = String(t); if (mis && mis !== 'genel' && !seen.has(k) && opts.length < 4) { seen.add(k); opts.push({ t: k, ok: false, mis }); } }
    return shuffle(opts);
  }

  const TUR = { mc: 'Çoktan seçmeli', tf: 'Doğru / yanlış', cmp: 'Karşılaştırma', input: 'Sayı yazma', kes: 'Parmakla kesir (çizerek)', match: 'Eşleştirme', tablo: 'Bilgileri yerleştirme', kur: 'Kartlarla işlem kurma' };
  const ASAMA = ATOLYE.ASAMA;
  const govde = (q) => `<div class="pq">${q.prompt}</div>${q.visual ? `<div class="visbox">${q.visual}</div>` : ''}${q.grid ? `<div class="pgrid">${q.grid.map((r) => `<div class="pcell">${r[0]}</div><div class="pcell ${r[1] === '?' ? 'miss' : ''}">${r[1]}</div>`).join('')}</div>` : ''}${q.cmp ? `<div class="cmpline"><span>${q.cmp[0]}</span><span class="cmpbox">?</span><span>${q.cmp[1]}</span></div>` : ''}${q.defter ? `<div class="defterler ${q.defter.length > 1 ? 'iki' : ''}">${q.defter.map((d) => `<div class="defter"><div class="dad">✏️ ${esc(U.wk(d.ad, 'in'))} defteri</div><ol>${d.satirlar.map((x, i) => `<li class="${d.isaret === i || d.hata === i ? 'isaret' : ''}">${x}${d.hata === i ? ' <small>(hatalı satır)</small>' : ''}</li>`).join('')}</ol></div>`).join('')}</div>` : ''}`;
  const yanlisSatir = (metin, mis, ac) => `<li class="ys"><div>${metin}</div><div class="ym">🧩 ${esc(misAd(mis))}${ac ? `<br><span>💬 Öğrenciye gösterilen açıklama: ${ac}</span>` : ''}</div></li>`;
  const cevap = (q) => {
    if (q.type === 'input') return `<div class="dc">✅ Doğru cevap: <b>${esc(q.answer).replace('.', ',')} ${esc(q.unit || '')}</b></div>${(q.inputMis || []).length ? `<div class="alt">Tanınan yanlış cevaplar (başka bir sayı girilirse "genel işlem hatası" sayılır):</div><ul class="yl">${q.inputMis.map((m) => yanlisSatir(`<b>${esc(String(m.v).replace('.', ','))}</b>`, m.mis, m.ac)).join('')}</ul>` : ''}`;
    if (q.type === 'kes') return `<div class="dc">✅ Hedef: <b>${q.cevap}</b> · Model: ${({ pie: 'daire (pasta)', bar: 'şerit', line: 'sayı doğrusu' })[q.model]}${q.parca ? `, ${q.parca} eş parça hazır` : ', öğrenci kaç parçaya böleceğini kendisi seçer'}${q.denk ? ' · denk kesir de kabul edilir' : ''}</div><ul class="yl">${yanlisSatir('Boş kısmı boyamak', 'bos_kisim')}${yanlisSatir('Pay ile paydayı ters kurmak', 'pay_payda_ters')}${q.model === 'line' ? yanlisSatir('Sayı doğrusunda bir çizgi eksik/fazla', 'cizgi_sayma') : ''}${yanlisSatir('Diğer bütün yanlış kurulumlar', 'kesir_model')}</ul>`;
    if (q.type === 'match') return `<div class="dc">✅ Doğru eşleşmeler:</div><ul class="eslesme">${q.pairs.map((p) => `<li><span>${p.a}</span><b>↔</b><span>${p.b}</span></li>`).join('')}</ul><div class="alt">Yanlış eşleştirme yanılgısı: ${esc(misAd(q.mis))}</div>`;
    if (q.type === 'tablo') return `<div class="dc">✅ Doğru yerleşim:</div><ul class="eslesme">${q.satirlar.map((r) => `<li><span>${r.t}</span><b>→</b><span>${ATOLYE.TABLO_AD[r.d]}</span></li>`).join('')}</ul><div class="alt">Ara sonuç ↔ sorulan karışırsa: ${esc(misAd('ara_sonuc'))}. Verilen bilgiyle karışırsa: ${esc(misAd('istenen_verilen'))}.</div>`;
    if (q.type === 'kur') return `<div class="dc">✅ Sayı kartları: <b>${q.kartlar.map((k) => U.fmtN(k)).join(' · ')}</b> (her biri bir kez) + işlem kartları + − × ÷ ( )<br>Örnek doğru işlem: <b>${q.cevap}</b> — aynı değeri veren her işlem kabul edilir.</div>${q.yanilgi.length ? `<div class="alt">Tanınan yanlış sonuçlar:</div><ul class="yl">${q.yanilgi.map((y) => yanlisSatir(`Sonuç <b>${ATOLYE.sayiYaz(y.v)}</b>`, y.mis, y.ac)).join('')}</ul>` : ''}`;
    const ok = q.options.filter((o) => o.ok), yan = q.options.filter((o) => !o.ok);
    return `${q.atolye && q.atolye.asama === 'tahmin' ? '<div class="alt">Tahmin puanlanmaz; öğrenciye doğru/yanlış denmez, çözünce karşılaştırılır.</div>' : ''}${ok.map((o) => `<div class="dc">✅ Doğru: <b>${o.t}</b></div>`).join('')}<ul class="yl">${yan.map((o) => yanlisSatir(o.t, o.mis, o.ac)).join('')}</ul>`;
  };
  const ekBilgi = (q) => `${q.hint || q.ip ? `<div class="ek"><b>💡 İpucu (öğrenci isterse / ilk yanlıştan sonra):</b> ${q.ip || q.hint}</div>` : ''}${(q.steps || []).length ? `<details class="ek"><summary>🪜 Çözüm adımları (ikinci yanlıştan sonra gösterilir)</summary><ol>${q.steps.map((s) => `<li>${s}</li>`).join('')}</ol></details>` : ''}`;
  const soruKart = (it) => {
    if (it.adimlar) { const b = it.adimlar[0].atolye;
      return `<div class="baglam"><div class="bt">🧩 ${esc(b.baslik)}</div><div>${b.baglam}</div></div>${it.adimlar.map((q, n) => `<div class="adim"><div class="an">${n + 1}. ${esc(ASAMA[q.atolye.asama] || q.atolye.asama)}${q.gerekce ? ' (gerekçe)' : ''} <small>${esc(TUR[q.type] || '')}</small>${q.atolye.asama === 'derin' ? ' <small>· yalnız çözüm adımlarını ilk denemede yapan öğrenciye gelir</small>' : ''}</div>${q.atolye.asama === 'bagimsiz' ? `<div class="baglam kucuk">${q.atolye.baglam}</div>` : ''}${govde(q)}${cevap(q)}${ekBilgi(q)}</div>`).join('')}`; }
    const q = it.q;
    return `<div class="tur">${esc(TUR[q.type] || q.type)}${q.hata ? ' · Hata Avcısı: ' + ({ bul: 'hatayı bul', kim: 'kim haklı', neden: 'hatanın nedeni' })[q.hata] : ''}${q.ref ? ' · kitaptaki soru tipinden esinlenildi' : ''}</div>${govde(q)}${cevap(q)}${ekBilgi(q)}`;
  };

  /* ---------- Ekranlar ---------- */
  const ETIKET = [['dil', 'Dil / anlatım'], ['seviye', '5. sınıf seviyesine uygun değil'], ['matematik', 'Matematik hatası'], ['mufredat', 'Müfredat dışı'], ['celdirici', 'Yanlış şık / yanılgı uygun değil'], ['aciklama', 'Açıklama / ipucu'], ['gorsel', 'Görsel / şekil'], ['yontem', 'Okulda öğretilen yönteme aykırı']];
  const sayac = () => { const k = Object.values(S.k); return { n: k.length, uygun: k.filter((x) => x.karar === 'uygun').length, duzelt: k.filter((x) => x.karar === 'duzelt').length, red: k.filter((x) => x.karar === 'uygun_degil').length }; };
  const bolumSay = (b) => sorular(b).filter((it) => S.k[it.id]).length;
  function giris() {
    return `<div class="og-kutu giris"><img src="img/pi_konus.webp" alt="" class="gpi"><h1>Soru İnceleme Paneli</h1><p class="sub">Matematik Yolu · 5. sınıf Maarif matematiği</p>
      <p>Merhaba! Bu uygulamadaki sorular bilgisayarla, her seferinde yeni sayılarla üretiliyor. Cevapları kod hesaplıyor; ama <b>sorunun sınıfta işe yarayıp yaramadığını</b> ancak bir öğretmen söyleyebilir. Her konudan örnek sorulara bakıp kısa bir karar vermenizi rica ediyoruz.</p>
      <h3>Neye bakmanızı istiyoruz?</h3><ul><li>Soru doğru ve tek cevaplı mı?</li><li>Dil 10–11 yaşındaki bir öğrenci için anlaşılır mı?</li><li>Zorluk 5. sınıf Maarif programına uygun mu?</li><li>Yanlış şıklar gerçekten öğrencilerin yaptığı hataları yansıtıyor mu? (Her yanlış şıkkın altında bağlı olduğu yanılgı yazıyor.)</li><li>Terimler ve yöntem okulda öğretilenle uyumlu mu?</li></ul>
      <p class="not">Bir soruyu "düzeltilmeli" diye işaretlemeniz, o <b>soru tipinin tamamının</b> düzeltilmesini sağlar. ${TOPLAM} örneğin hepsine bakmanız gerekmez; istediğiniz konudan başlayabilir, istediğiniz zaman bırakıp kaldığınız yerden devam edebilirsiniz.</p>
      <label class="lbl">Adınız (yalnız incelemelerde görünür)<input id="ad" maxlength="60" placeholder="Örn. Ayşe Öğretmen" value="${esc(S.ad)}"></label>
      <button class="btn ok" data-a="basla">İncelemeye başla</button></div>`;
  }
  function ozet() {
    const c = sayac(), isaretli = Object.entries(S.k).filter(([, k]) => k.karar !== 'uygun');
    return `<div class="og-kutu"><div class="row ust"><h2>📋 Özet</h2><button class="btn ghost kucukb" data-a="ozet-kapat">← Sorulara dön</button></div>
      <div class="sayilar"><div><b>${c.n}</b><span>incelendi / ${TOPLAM}</span></div><div class="u"><b>${c.uygun}</b><span>✅ uygun</span></div><div class="d"><b>${c.duzelt}</b><span>✏️ düzeltilmeli</span></div><div class="r"><b>${c.red}</b><span>❌ uygun değil</span></div></div>
      <h3>Konulara göre</h3><div class="bliste">${BOLUM.map((b) => { const n = sorular(b).length, m = bolumSay(b); return `<button class="bsatir" data-a="git" data-v="${b.id}"><span>${esc(b.ad)}</span><span class="bar"><i style="width:${Math.round((100 * m) / n)}%"></i></span><small>${m}/${n}</small></button>`; }).join('')}</div>
      <h3>İşaretlediğiniz sorular (${isaretli.length})</h3>${isaretli.length ? `<ul class="isaretli">${isaretli.map(([id, k]) => { const it = bul(id); return `<li><button data-a="soruya" data-v="${id}">${k.karar === 'duzelt' ? '✏️' : '❌'} ${esc(it ? (CUR.SKILL[it.beceri] || {}).title || it.beceri : id)}</button> ${(k.etiketler || []).map((e) => `<span class="et">${esc((ETIKET.find((x) => x[0] === e) || [, e])[1])}</span>`).join(' ')}${k.aciklama ? `<div class="na">“${esc(k.aciklama)}”</div>` : ''}</li>`; }).join('')}</ul>` : '<p class="muted">Henüz işaretlenen soru yok.</p>'}
      ${MESAJ ? `<div class="uyari">${MESAJ}</div>` : ''}<p class="muted sm">Kararlarınız otomatik olarak geliştirici ekibe iletiliyor. Teşekkür ederiz! 🙏</p></div>`;
  }
  function ana() {
    const b = BOLUM.find((x) => x.id === S.bolum) || BOLUM[0], L = sorular(b); S.i = Math.max(0, Math.min(S.i, L.length - 1));
    const it = L[S.i], k = S.k[it.id], c = sayac(), f = FORM && FORM.id === it.id ? FORM : null;
    const temalar = [...new Set(BOLUM.map((x) => x.tema))];
    const secim = `<select id="bolum" aria-label="Konu seç">${temalar.map((t) => `<optgroup label="${esc(t)}">${BOLUM.filter((x) => x.tema === t).map((x) => `<option value="${x.id}" ${x.id === b.id ? 'selected' : ''}>${bolumSay(x) === sorular(x).length ? '✓ ' : ''}${esc(x.ad)} (${bolumSay(x)}/${sorular(x).length})</option>`).join('')}</optgroup>`).join('')}</select>`;
    const kararForm = f ? `<div class="kform"><div class="kbas">${f.karar === 'duzelt' ? '✏️ Düzeltilmeli' : '❌ Uygun değil'}: neyle ilgili?</div><div class="etler">${ETIKET.map(([e, ad]) => `<button class="et ${f.etiketler.includes(e) ? 'on' : ''}" data-a="etiket" data-v="${e}">${ad}</button>`).join('')}</div>
      <textarea id="acik" maxlength="2000" placeholder="Ne değişmeli? Kısa bir not yeterli. (Örn. &quot;'bütünler' yerine kitapta … deniyor&quot;)">${esc(f.aciklama)}</textarea>
      <div class="row"><button class="btn ghost" data-a="vazgec">Vazgeç</button><button class="btn" data-a="kaydet" ${f.etiketler.length || f.aciklama.trim() ? '' : 'disabled'}>Kaydet ve sonraki →</button></div></div>` : '';
    const mevcut = k && !f ? `<div class="mevcut ${k.karar}">${k.karar === 'uygun' ? '✅ Uygun dediniz' : k.karar === 'duzelt' ? '✏️ Düzeltilmeli dediniz' : '❌ Uygun değil dediniz'}${(k.etiketler || []).length ? ' · ' + k.etiketler.map((e) => (ETIKET.find((x) => x[0] === e) || [, e])[1]).join(', ') : ''}${k.aciklama ? `<div class="na">“${esc(k.aciklama)}”</div>` : ''}${k.gonderildi ? '' : ' <small>(gönderiliyor…)</small>'}</div>` : '';
    return `<header class="og-ust"><div><b>Soru İnceleme</b><small>${esc(S.ad)} · ${c.n}/${TOPLAM} incelendi</small></div><button class="btn ghost kucukb" data-a="ozet">📋 Özet</button></header>
      <div class="og-kutu">${secim}<div class="ilerle"><i style="width:${Math.round((100 * bolumSay(b)) / L.length)}%"></i></div>
      <div class="row ust"><div class="sno">${b.tur === 'atolye' ? 'Problem' : 'Soru'} ${S.i + 1}/${L.length}${it.q ? ` · seviye ${'●'.repeat(it.seviye)}${'○'.repeat(3 - it.seviye)}` : ''}${b.tur === 'hata' ? ` · ${esc((CUR.SKILL[it.beceri] || {}).title || '')}` : ''}</div><div class="row"><button class="btn ghost kucukb" data-a="geri" ${S.i ? '' : 'disabled'} aria-label="Önceki">←</button><button class="btn ghost kucukb" data-a="ileri" ${S.i < L.length - 1 ? '' : 'disabled'} aria-label="Sonraki">→</button></div></div>
      <div class="kart">${soruKart(it)}</div>${mevcut}${kararForm}
      ${f ? '' : `<div class="kararlar"><button class="btn ok" data-a="karar" data-v="uygun">✅ Uygun</button><button class="btn warn" data-a="karar" data-v="duzelt">✏️ Düzeltilsin</button><button class="btn bad" data-a="karar" data-v="uygun_degil">❌ Uygun değil</button></div>`}
      ${MESAJ ? `<div class="uyari">${MESAJ}</div>` : ''}<div class="muted sm kimlik">Soru kimliği: ${esc(it.id)} · sürüm ${esc(SURUM)}</div></div>`;
  }
  function ciz() {
    if (!KOD || !CFG.supabaseUrl) { el.innerHTML = `<div class="og-kutu giris"><h1>Soru İnceleme Paneli</h1><p>Bu sayfa davet bağlantısıyla açılır. Size gönderilen bağlantıyı kullanın.</p></div>`; return; }
    if (GECERLI === null) { el.innerHTML = `<div class="og-kutu giris"><p>Bağlantı kontrol ediliyor…</p></div>`; return; }
    if (GECERLI === false) { el.innerHTML = `<div class="og-kutu giris"><h1>Soru İnceleme Paneli</h1><p>Bu davet bağlantısı geçerli değil ya da süresi dolmuş. Lütfen sizi davet eden kişiyle iletişime geçin.</p></div>`; return; }
    el.innerHTML = !S.ad ? giris() : S.ozet ? ozet() : ana();
  }
  const ilerle = () => { const b = BOLUM.find((x) => x.id === S.bolum), L = sorular(b); if (S.i < L.length - 1) S.i++; else { const j = BOLUM.indexOf(b); if (j < BOLUM.length - 1) { S.bolum = BOLUM[j + 1].id; S.i = 0; } } };
  const kararVer = (id, karar, etiketler, aciklama) => { S.k[id] = { karar, etiketler, aciklama, zaman: Date.now(), gonderildi: false }; FORM = null; ilerle(); sakla(); ciz(); window.scrollTo(0, 0); bekleyenleriGonder(); };

  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, v = b.dataset.v;
    const L = () => sorular(BOLUM.find((x) => x.id === S.bolum)), cur = () => L()[S.i];
    if (a === 'basla') { const ad = (document.getElementById('ad').value || '').trim(); if (!ad) { document.getElementById('ad').focus(); return; } S.ad = ad; sakla(); ciz(); }
    else if (a === 'karar') { if (v === 'uygun') kararVer(cur().id, 'uygun', [], ''); else { const k = S.k[cur().id]; FORM = { id: cur().id, karar: v, etiketler: k && k.karar === v ? (k.etiketler || []).slice() : [], aciklama: k && k.karar === v ? k.aciklama || '' : '' }; ciz(); const t = document.querySelector('.kform'); if (t) t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
    else if (a === 'etiket') { const i = FORM.etiketler.indexOf(v); if (i >= 0) FORM.etiketler.splice(i, 1); else FORM.etiketler.push(v); FORM.aciklama = document.getElementById('acik').value; ciz(); }
    else if (a === 'vazgec') { FORM = null; ciz(); }
    else if (a === 'kaydet') { FORM.aciklama = document.getElementById('acik').value.trim(); kararVer(FORM.id, FORM.karar, FORM.etiketler, FORM.aciklama); }
    else if (a === 'geri') { S.i--; FORM = null; sakla(); ciz(); window.scrollTo(0, 0); }
    else if (a === 'ileri') { S.i++; FORM = null; sakla(); ciz(); window.scrollTo(0, 0); }
    else if (a === 'ozet') { S.ozet = true; sakla(); ciz(); window.scrollTo(0, 0); }
    else if (a === 'ozet-kapat') { S.ozet = false; sakla(); ciz(); }
    else if (a === 'git') { S.bolum = v; S.i = 0; S.ozet = false; sakla(); ciz(); window.scrollTo(0, 0); }
    else if (a === 'soruya') { for (const x of BOLUM) { const j = sorular(x).findIndex((it) => it.id === v); if (j >= 0) { S.bolum = x.id; S.i = j; } } S.ozet = false; sakla(); ciz(); window.scrollTo(0, 0); }
  });
  el.addEventListener('change', (ev) => { if (ev.target.id === 'bolum') { S.bolum = ev.target.value; S.i = 0; FORM = null; sakla(); ciz(); } });
  el.addEventListener('input', (ev) => { if (ev.target.id === 'acik' && FORM) { FORM.aciklama = ev.target.value; const k = el.querySelector('[data-a=kaydet]'); if (k) k.disabled = !(FORM.etiketler.length || FORM.aciklama.trim()); } });
  addEventListener('online', bekleyenleriGonder);

  let GECERLI = null; ciz();
  if (KOD && CFG.supabaseUrl) rpc('inceleme_kod_gecerli', { p_kod: KOD }).then((ok) => { GECERLI = ok === true; ciz();
    if (GECERLI) rpc('inceleme_listesi', { p_kod: KOD }).then((rows) => { (rows || []).forEach((r) => { if (!S.k[r.soru_id]) S.k[r.soru_id] = { karar: r.karar, etiketler: r.etiketler || [], aciklama: r.aciklama || '', zaman: Date.parse(r.zaman), gonderildi: true }; }); sakla(); ciz(); bekleyenleriGonder(); }).catch(() => { }); })
    .catch(() => { GECERLI = true; MESAJ = '⚠️ Sunucuya ulaşılamadı. Kararlarınız cihazınızda saklanıyor; internet gelince gönderilecek.'; ciz(); });
  G.MY_OGRETMEN = { BOLUM, sorular, TOPLAM, durum: () => S };
})();
</script>
</body>
</html>

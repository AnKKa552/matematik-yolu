:root{--bg:#f6f5ff;--kart:#fff;--yazi:#1d1b2e;--soluk:#5c5875;--ana:#4a3ae0;--cizgi:#e4e1f5;--ok:#13804a;--bad:#c0262d;--mavi:#2563c9;--sari:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#121022;--kart:#1c1932;--yazi:#ecebf7;--soluk:#a9a5c4;--ana:#a69dff;--cizgi:#2e2a4a;--ok:#4ade80;--bad:#f87171;--mavi:#7fb0ff;--sari:#facc15}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
body.gizli{visibility:hidden}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1.1rem;margin:0 0 10px}
.ust{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ust .bosluk{flex:1}
.kart{background:var(--kart);border:2px solid var(--cizgi);border-radius:16px;padding:16px;margin-bottom:14px}
.giris{max-width:420px;margin:8vh auto 0}
label{display:block;font-weight:700;font-size:.92rem;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--cizgi);border-radius:12px;background:var(--bg);color:var(--yazi)}
.ust select{width:auto}
input:focus,select:focus{outline:3px solid var(--ana);outline-offset:1px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--ana);color:#fff;min-height:44px}
button.ikincil{background:transparent;color:var(--ana);border:2px solid var(--cizgi)}
button[disabled]{opacity:.6;cursor:default}
.tam{width:100%;margin-top:16px}
.hata{color:var(--bad);font-weight:700;margin-top:10px;min-height:1.4em}
.not{color:var(--soluk);font-size:.9rem}
.sayilar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sayi{background:var(--kart);border:2px solid var(--cizgi);border-radius:14px;padding:12px 14px}
.sayi b{display:block;font-size:1.8rem;line-height:1.1}
.sayi span{color:var(--soluk);font-size:.88rem}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.iki{grid-template-columns:1fr}}
.tablo{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--cizgi);vertical-align:top}
th{color:var(--soluk);font-weight:700;white-space:nowrap}
td.s{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.metin{max-width:420px}
.etk{display:inline-block;font-size:.78rem;padding:1px 7px;border-radius:99px;border:1px solid var(--cizgi);color:var(--soluk);white-space:nowrap}
.cubuk{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--cizgi);min-width:80px}
.cubuk i{display:block;height:100%}
.c-ilk{background:var(--ok)} .c-ipu{background:var(--mavi)} .c-coz{background:var(--bad)}
svg text{fill:var(--soluk);font-size:11px}
.bos{color:var(--soluk);font-style:italic}
.sekme{display:flex;gap:6px;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:700;color:var(--ana)}
</style>

    return '<div class="tablo"><table><thead><tr><th>Konu</th><th>Soru kalıbı</th><th>Cevap</th><th>İlk deneme</th><th>İpucu</th><th>Çözüm</th><th>Ort. süre</th><th></th></tr></thead><tbody>' +
      liste.map(function (s) {
        return '<tr><td>' + esc(becAd(s.beceri)) + '</td><td class="metin">' + esc(s.metin || '(metin yok)') + ' <span class="etk">' + esc(s.tur) + '</span></td><td class="s">' + n(s.n) +
          '</td><td class="s">%' + yuz(s.ilk, s.n) + '</td><td class="s">' + n(s.ipucu) + '</td><td class="s">' + n(s.cozum) + '</td><td class="s">' + esc(s.ort_sn) + ' sn</td><td>' + cubuk(s) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function grafik(g) {
    if (!g || !g.length) return '';
    var W = 1000, H = 170, P = 26, mx = Math.max(1, Math.max.apply(null, g.map(function (d) { return Math.max(d.acan, d.ders); }))),
      bw = (W - P) / g.length, s = '';
    g.forEach(function (d, i) {
      var x = P + i * bw, h1 = (H - 30) * d.acan / mx, h2 = (H - 30) * d.ders / mx;
      s += '<rect x="' + (x + 1) + '" y="' + (H - 20 - h1) + '" width="' + Math.max(1, bw / 2 - 2) + '" height="' + h1 + '" fill="var(--ana)" rx="2"><title>' + esc(d.gun) + ': ' + d.acan + ' telefon</title></rect>';
      s += '<rect x="' + (x + bw / 2) + '" y="' + (H - 20 - h2) + '" width="' + Math.max(1, bw / 2 - 2) + '" height="' + h2 + '" fill="var(--ok)" rx="2"><title>' + esc(d.gun) + ': ' + d.ders + ' ders</title></rect>';
      if (g.length <= 31 ? i % Math.ceil(g.length / 10) === 0 : i % 14 === 0) s += '<text x="' + x + '" y="' + (H - 4) + '">' + esc(String(d.gun).slice(5).split('-').reverse().join('.')) + '</text>';
    });
    s += '<text x="0" y="12">' + mx + '</text><text x="0" y="' + (H - 22) + '">0</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Günlük açan telefon ve ders sayısı">' + s + '</svg>' +
      '<p class="not"><span style="color:var(--ana)">■</span> uygulamayı açan telefon &nbsp; <span style="color:var(--ok)">■</span> başlatılan ders</p>';
  }

  function panelCiz() {
    var r = DURUM.veri, k = r.kullanici || {}, t = r.toplam || {}, h = r.hizmet || {}, d = r.donus || {};
    var donus = (d.d1 || 0) + (d.d2_7 || 0) + (d.d8_30 || 0) + (d.d31 || 0);
    var html = '<div class="ust"><h1>📊 Matematik Yolu · Yönetim</h1><span class="bosluk"></span>' +
      '<select id="gun" aria-label="Dönem">' + [7, 30, 90, 365].map(function (g) { return '<option value="' + g + '"' + (g === DURUM.gun ? ' selected' : '') + '>Son ' + g + ' gün</option>'; }).join('') + '</select>' +
      '<button class="ikincil" id="yenile">Yenile</button><button class="ikincil" id="sd">Şifre değiştir</button><button id="cik">Çıkış</button></div>' +
      '<p class="not">Giriş yapan: <b>' + esc(r.ad) + '</b> · Dönem: ' + esc(r.bas) + ' – ' + esc(r.bugun) + (k.ilk_kayit ? ' · Kullanıcı sayacı ' + esc(k.ilk_kayit) + ' tarihinden beri çalışıyor' : ' · Kullanıcı sayacı henüz veri almadı') + '</p>' +
      '<div class="sayilar">' +
      '<div class="sayi"><b>' + n(k.bugun) + '</b><span>bugün açan telefon</span></div>' +
      '<div class="sayi"><b>' + n(k.hafta) + '</b><span>bu hafta açan telefon</span></div>' +
      '<div class="sayi"><b>' + n(k.ay) + '</b><span>bu ay açan telefon</span></div>' +
      '<div class="sayi"><b>' + n(k.yeni_donem) + '</b><span>dönemde ilk kez açan</span></div>' +
      '<div class="sayi"><b>' + n(t.cevap) + '</b><span>dönemde cevaplanan soru</span></div>' +
      '<div class="sayi"><b>%' + yuz(t.ilk, t.cevap) + '</b><span>ilk denemede doğru</span></div>' +
      '<div class="sayi"><b>' + esc(t.ort_sn == null ? '–' : t.ort_sn) + ' sn</b><span>soru başına ortalama süre</span></div>' +
      '<div class="sayi"><b>' + n(t.ipucu) + ' / ' + n(t.cozum) + '</b><span>ipucuyla / çözüm gösterildi</span></div>' +
      '</div>' +
      '<div class="kart"><h2>Günlük kullanım</h2>' + grafik(r.gunluk) + '</div>' +
      '<div class="iki"><div class="kart"><h2>Geri gelenler</h2>' + (donus ? '<table><tbody>' +
        [['d1', 'Ertesi gün'], ['d2_7', '2–7 gün sonra'], ['d8_30', '8–30 gün sonra'], ['d31', '1 aydan sonra']].map(function (x) { return '<tr><td>' + x[1] + '</td><td class="s">' + n(d[x[0]]) + '</td></tr>'; }).join('') +
        '</tbody></table><p class="not">Bir telefonun ilk açılışından kaç gün sonra yeniden açıldığı (her açılış günü bir kez sayılır).</p>' : '<p class="bos">Henüz veri yok.</p>') + '</div>' +
      '<div class="kart"><h2>Kayıtlar</h2><table><tbody>' +
        [['yedek', 'Bulut yedeği açık'], ['yedek_7g', 'Son 7 günde yedeklenen'], ['oyuncu', 'Oyuncu adı'], ['pilot', 'Geliştirme katkısı onayı'], ['bildirim', 'Bildirim açık'], ['eposta', 'Haftalık rapor e-postası']]
          .map(function (x) { return '<tr><td>' + x[1] + '</td><td class="s">' + n(h[x[0]]) + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
      '<div class="kart"><h2>En çok zorlanılan sorular</h2><p class="not">İpucu ya da çözüm gerektiren cevapların oranına göre. Çubuk: <span style="color:var(--ok)">■</span> ilk denemede doğru <span style="color:var(--mavi)">■</span> ipucuyla <span style="color:var(--bad)">■</span> çözüm gösterildi</p>' + soruTablo(r.zor, 'Henüz zorlanılan soru yok.') + '</div>' +
      '<div class="kart"><h2>En uzun düşünülen sorular</h2>' + soruTablo(r.uzun, 'Henüz veri yok.') + '</div>' +
      '<div class="kart"><h2>En çok ipucu kullanılan sorular</h2>' + soruTablo(r.ipucu, 'Henüz ipucu kullanılmamış.') + '</div>' +
      '<div class="iki"><div class="kart"><h2>Konulara göre</h2>' + ((r.beceri || []).length ? '<div class="tablo"><table><thead><tr><th>Konu</th><th>Cevap</th><th>İlk deneme</th><th>İpucu</th><th>Ort. süre</th></tr></thead><tbody>' +
        r.beceri.map(function (b) { return '<tr><td>' + esc(becAd(b.beceri)) + '</td><td class="s">' + n(b.n) + '</td><td class="s">%' + esc(b.ilk_yuzde) + '</td><td class="s">%' + esc(b.ipucu_yuzde) + '</td><td class="s">' + esc(b.ort_sn) + ' sn</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="bos">Henüz veri yok.</p>') + '</div>' +
      '<div class="kart"><h2>En sık yanılgılar</h2>' + ((r.yanilgi || []).length ? '<table><tbody>' +
        r.yanilgi.map(function (y) { return '<tr><td>' + esc(misAd(y.mis)) + '</td><td class="s">' + n(y.n) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="bos">Henüz veri yok.</p>') + '</div></div>' +
      '<div class="iki"><div class="kart"><h2>Yarıda bırakılan dersler</h2>' + ((r.birakma || []).length ? '<div class="tablo"><table><thead><tr><th>Tür</th><th>Konu</th><th>Başlatılan</th><th>Biten</th><th>Bırakılan</th></tr></thead><tbody>' +
        r.birakma.map(function (b) { return '<tr><td>' + esc(MOD[b.mod] || b.mod) + '</td><td>' + esc(b.beceri === '-' ? 'Karışık' : becAd(b.beceri)) + '</td><td class="s">' + n(b.basla) + '</td><td class="s">' + n(b.bitti) + '</td><td class="s">' + n(b.birak) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="bos">Henüz veri yok.</p>') +
        (r.birak_soru ? '<p class="not">Kaçıncı soruda bırakıldı: ' + Object.keys(r.birak_soru).sort(function (a, b) { return a - b; }).map(function (s) { return esc(s) + '. soru: ' + n(r.birak_soru[s]); }).join(' · ') + '</p>' : '') + '</div>' +
      '<div class="kart"><h2>Son yönetici girişleri</h2><p class="not">Tanımadığınız bir giriş görürseniz hemen şifrenizi değiştirin.</p><table><tbody>' +
        (r.girisler || []).map(function (g) { return '<tr><td>' + esc(new Date(g.zaman).toLocaleString('tr-TR')) + '</td><td>' + esc({ giris: '✅ giriş', yanlis: '❌ yanlış şifre', kilitli: '🔒 kilitliyken deneme', sinir: '⛔ sınır', kurulum: '🛠️ kurulum', kurulum_yanlis: '❌ yanlış kurulum kodu', cikis: '↩️ çıkış', sifre: '🔑 şifre değişti' }[g.olay] || g.olay) + '</td><td>' + esc(g.ad || '') + '</td></tr>'; }).join('') +
        '</tbody></table></div></div>' +
      '<p class="not">Kişisel veri yok: sayılar telefonlardan isimsiz toplam olarak gelir; ad, IP adresi ya da cihaz numarası saklanmaz. Oturum 8 saatte ya da 30 dakika işlem yapılmazsa kapanır.</p>';
    m.innerHTML = html;
    document.getElementById('gun').onchange = function (e) { DURUM.gun = Number(e.target.value); yukle(); };
    document.getElementById('yenile').onclick = yukle;
    document.getElementById('cik').onclick = function () { cikis('Çıkış yapıldı.'); };
    document.getElementById('sd').onclick = sifreCiz;
  }

  function sifreCiz() {
    m.innerHTML = '<div class="kart giris"><h1>Şifre değiştir</h1><form id="fs"><label for="e">Şu anki şifre</label><input id="e" type="password" autocomplete="current-password" required>' +
      '<label for="y1">Yeni şifre (en az 12 karakter, harf ve rakam)</label><input id="y1" type="password" autocomplete="new-password" required maxlength="128">' +
      '<label for="y2">Yeni şifre (tekrar)</label><input id="y2" type="password" autocomplete="new-password" required maxlength="128">' +
      '<button class="tam" type="submit">Değiştir</button><button class="tam ikincil" type="button" id="geri">Vazgeç</button><div class="hata" id="hs"></div></form>' +
      '<p class="not">Değişince bütün oturumlar kapanır, yeni şifrenizle yeniden giriş yaparsınız.</p></div>';
    document.getElementById('geri').onclick = panelCiz;
    document.getElementById('fs').addEventListener('submit', function (e) {
      e.preventDefault(); var hs = document.getElementById('hs'), y1 = document.getElementById('y1').value;
      if (y1 !== document.getElementById('y2').value) { hs.textContent = 'İki yeni şifre aynı değil.'; return; }
      rpc('yonetici_sifre_degistir', { p_belirtec: oturum(), p_eski: document.getElementById('e').value, p_yeni: y1 }).then(function (r) {
        if (r && r.ok) { oturumYaz(''); girisCiz('Şifre değişti. Yeni şifrenizle giriş yapın.'); return; }
        if (r && r.hata === 'oturum') { oturumYaz(''); girisCiz(HATA.oturum); return; }
        hs.textContent = r && r.hata === 'yanlis' ? 'Şu anki şifre yanlış.' : HATA[r && r.hata] || 'Değiştirilemedi.';
      }).catch(function () { hs.textContent = 'Sunucuya ulaşılamadı.'; });
    });
  }

  if (!CFG.supabaseUrl) { m.innerHTML = '<div class="kart giris">Sunucu ayarı bulunamadı.</div>'; return; }
  if (oturum()) { bosSay(); yukle(); } else girisCiz('');
})();
</script>
</body>
</html>
